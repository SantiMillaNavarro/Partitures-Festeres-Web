name: W2.6 Android-style inline text editor
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  inline-text:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
      - name: Start local server
        run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/partitures-w26.log 2>&1 &
      - name: Validate JavaScript source
        run: |
          node --check annotations.js
          node --check annotation-geometry.js
          node --check inline-text-w26.js
          node --check viewer-w26.js
          node --check app-w26.js
          node --check rosette-w25.js
          node --check .github/scripts/w26-inline-text.mjs
      - name: Verify writing in PDF, styles, rotation and fallback
        run: node .github/scripts/w26-inline-text.mjs
