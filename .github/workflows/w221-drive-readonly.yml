name: W2.21 Google Drive lectura i importacio segura
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  drive-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Use installed Chrome
        run: |
          for browser in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$browser" >/dev/null 2>&1; then
              echo "PF_CHROMIUM_PATH=$(command -v "$browser")" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          exit 1
      - name: Start local server
        run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/pf-w221.log 2>&1 &
      - name: Syntax check
        run: |
          node --check drive-w221.js
          node --check drive-ui-w221.js
          node --check app-w221.js
          node --check backup.js
          node --check .github/scripts/w221-drive-readonly.mjs
      - name: Test Drive read-only integration with mock Google APIs
        run: node .github/scripts/w221-drive-readonly.mjs
