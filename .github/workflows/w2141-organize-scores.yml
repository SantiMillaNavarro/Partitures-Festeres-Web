name: W2.14.1 Organitzar partituras
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  organize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
      - name: Start local server
        run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/pf-w2141.log 2>&1 &
      - name: Validate JS syntax
        run: |
          node --check app-w2141.js
          node --check db.js
          node --check score-organize-w2141.js
          node --check score-organize-ui-w2141.js
          node --check .github/scripts/w2141-organize-scores.mjs
      - name: Move rename and preserve PDF references
        run: node .github/scripts/w2141-organize-scores.mjs
