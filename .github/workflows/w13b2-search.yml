name: W1.3B.2 advanced search tests
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
      - name: Start server
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/partitures.log 2>&1 &
      - name: Check syntax
        run: |
          node --check app-w13b2.js
          node --check search-filters.js
          node --check .github/scripts/w13b2-search.mjs
      - name: Run advanced search browser tests
        run: node .github/scripts/w13b2-search.mjs
