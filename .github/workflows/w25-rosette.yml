name: W2.5 Android-style annotation rosette
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  rosette:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
      - name: Start HTTP server
        run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/partitures-w25.log 2>&1 &
      - name: Verify JavaScript syntax
        run: |
          node --check app-w25.js
          node --check rosette-w25.js
          node --check rosette-ui-w25.js
          node --check .github/scripts/w25-rosette.mjs
      - name: Verify radial rosette, editor tools and backward compatibility
        run: node .github/scripts/w25-rosette.mjs
