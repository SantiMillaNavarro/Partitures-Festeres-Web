name: W2.24 Copia de dades de biblioteca vinculada
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  linked-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Use installed Chrome
        run: |
          for browser in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$browser" >/dev/null 2>&1; then
              echo "PF_CHROMIUM_PATH=$(command -v "$browser")" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          exit 1
      - name: Start local server
        run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/pf-w224.log 2>&1 &
      - name: Syntax check
        run: |
          node --check app-w223.js
          node --check linked-backup-w224.js
          node --check db.js
          node --check .github/scripts/w224-linked-backup.mjs
      - name: Test linked data export and restore
        run: node .github/scripts/w224-linked-backup.mjs
