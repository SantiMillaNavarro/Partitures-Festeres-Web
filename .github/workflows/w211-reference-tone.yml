name: W2.11 Nota de referencia Android i Web Audio
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  reference-tone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
      - name: Start local server
        run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/pf-w211.log 2>&1 &
      - name: Check syntax
        run: |
          node --check app-w211.js
          node --check reference-tone-w211.js
          node --check reference-tone-ui-w211.js
          node --check reference-tone-controller-w211.js
          node --check .github/scripts/w211-reference-tone.mjs
      - name: Test chromatic note and Web Audio lifecycle
        run: node .github/scripts/w211-reference-tone.mjs
