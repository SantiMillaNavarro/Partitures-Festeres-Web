name: W2.15.1 Actuacio Chrome del runner
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  fast-performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright library (not browser)
        run: npm install --no-save playwright
      - name: Find preinstalled Chrome
        shell: bash
        run: |
          for browser in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$browser" >/dev/null 2>&1; then
              echo "PF_CHROMIUM_PATH=$(command -v "$browser")" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "No system Chrome available" >&2
          exit 1
      - name: Start local server
        run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/pf-fast-w2151.log 2>&1 &
      - name: Check JS syntax and test circular repertoire
        run: |
          node --check app-w2151.js
          node --check repertoire-performance-w2151.js
          node .github/scripts/w2151-repertoire-performance.mjs
