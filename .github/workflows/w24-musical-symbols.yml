name: W2.4 Musical symbols and annotation rosette
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  musical-symbols:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
      - name: Start local HTTP server
        run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/partitures-w24.log 2>&1 &
      - name: Check source syntax
        run: |
          node --check annotations.js
          node --check annotation-geometry.js
          node --check musical-symbols.js
          node --check viewer-w24.js
          node --check app-w24.js
          node --check .github/scripts/w24-musical-symbols.mjs
      - name: Verify musical annotations, navigation and ZIP
        run: node .github/scripts/w24-musical-symbols.mjs
