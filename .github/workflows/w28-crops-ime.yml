name: W2.8 Retalls i teclat IME Fet
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  crops-and-keyboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
      - name: Start local server
        run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/pf-w28.log 2>&1 &
      - name: Syntax checks
        run: |
          node --check annotation-crops.js
          node --check annotations.js
          node --check annotation-geometry.js
          node --check inline-text-w28.js
          node --check viewer-w28.js
          node --check app-w28.js
          node --check rosette-w28.js
          node --check rosette-ui-w28.js
          node --check .github/scripts/w28-crops-ime.mjs
      - name: Crops, Android Done key and backup compatibility
        run: node .github/scripts/w28-crops-ime.mjs
