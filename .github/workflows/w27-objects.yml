name: W2.7 - objectes, gir i text d'un sol ús
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  objects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
      - name: Start local web server
        run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/pf-w27.log 2>&1 &
      - name: Check modules
        run: |
          node --check annotations.js
          node --check annotation-geometry.js
          node --check viewer-w27.js
          node --check app-w27.js
          node --check inline-text-w27.js
          node --check rosette-ui-w27.js
          node --check .github/scripts/w27-objects.mjs
      - name: Test Android-style one-time text and object editing
        run: node .github/scripts/w27-objects.mjs
