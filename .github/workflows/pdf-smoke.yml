name: PDF viewer smoke test
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
      - name: Start HTTP server
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/pfweb.log 2>&1 &
      - name: Test PDF viewer
        run: node .github/scripts/pdf-smoke.mjs
