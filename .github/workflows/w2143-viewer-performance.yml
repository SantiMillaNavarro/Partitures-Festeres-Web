name: W2.14.3 Prioritat del visor PDF
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  viewer-performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
      - name: Start local server
        run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/pf-w2143.log 2>&1 &
      - name: Check syntax
        run: |
          node --check app-w2143.js
          node --check pdf-thumbnails-w2143.js
          node --check .github/scripts/w2143-viewer-performance.mjs
      - name: Test cancel thumbnail, open PDF and resume thumbnails
        run: node .github/scripts/w2143-viewer-performance.mjs
