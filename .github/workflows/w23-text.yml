name: W2.3 text annotations
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  text-annotations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
      - name: Start HTTP server
        run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/partitures-w23.log 2>&1 &
      - name: Check JavaScript syntax
        run: |
          node --check annotations.js
          node --check annotation-geometry.js
          node --check viewer-w23.js
          node --check app-w23.js
          node --check .github/scripts/w23-text.mjs
      - name: Test text editing and ZIP restore in Chromium
        run: node .github/scripts/w23-text.mjs
