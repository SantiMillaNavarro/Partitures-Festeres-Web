name: W2.4.1 Text boxes and music orientation
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  textboxes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
      - name: Start HTTP server
        run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/partitures-w241.log 2>&1 &
      - name: Validate JavaScript
        run: |
          node --check annotations.js
          node --check annotation-geometry.js
          node --check viewer-w241.js
          node --check app-w241.js
          node --check .github/scripts/w241-textboxes-orientation.mjs
      - name: Verify rotated symbols and resizable text boxes
        run: node .github/scripts/w241-textboxes-orientation.mjs
