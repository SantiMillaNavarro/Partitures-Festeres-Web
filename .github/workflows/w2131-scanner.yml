name: W2.13.1 Escaner multipagina i PDF
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
      - name: Start local server
        run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/pf-w2131.log 2>&1 &
      - name: Check scanner syntax
        run: |
          node --check app-w2131.js
          node --check scanner-pdf-w2131.js
          node --check scanner-ui-w2131.js
          node --check scanner-controller-w2131.js
          node --check .github/scripts/w2131-scanner.mjs
      - name: Test local scanner, PDF and integration
        run: node .github/scripts/w2131-scanner.mjs
