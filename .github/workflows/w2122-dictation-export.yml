name: W2.12.2 Exportar i compartir Dictat
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  dictation-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
      - name: Start local server
        run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/pf-w2122.log 2>&1 &
      - name: Check syntax
        run: |
          node --check app-w2122.js
          node --check dictation-export-w2122.js
          node --check dictation-ui-w2122.js
          node --check dictation-controller-w2122.js
          node --check .github/scripts/w2122-dictation-export.mjs
      - name: Test PNG, ZIP and Web Share
        run: node .github/scripts/w2122-dictation-export.mjs
