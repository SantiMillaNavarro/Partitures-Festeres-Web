name: W2.3.1 Landscape PDF viewer
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  landscape-on-touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
      - name: Start local HTTP server
        run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/partitures-landscape.log 2>&1 &
      - name: Check JavaScript syntax
        run: |
          node --check app-w231.js
          node --check viewer-w231.js
          node --check viewer-orientation.js
          node --check .github/scripts/w231-landscape.mjs
      - name: Verify landscape viewport and transformed touch coordinates
        run: node .github/scripts/w231-landscape.mjs
