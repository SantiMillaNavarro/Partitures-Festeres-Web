name: W2.10 Afinador cromatic YIN
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  tuner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
      - name: Start local server
        run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/pf-w210.log 2>&1 &
      - name: Check syntax
        run: |
          node --check app-w210.js
          node --check metronome-ui-w210.js
          node --check metronome-controller-w210.js
          node --check tuner-w210.js
          node --check tuner-worker-w210.js
          node --check tuner-ui-w210.js
          node --check tuner-controller-w210.js
          node --check .github/scripts/w210-tuner.mjs
      - name: Test chromatic tuner and microphone lifecycle
        run: node .github/scripts/w210-tuner.mjs
