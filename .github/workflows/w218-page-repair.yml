name: W2.18 Ajustos individuals de pàgina
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  page-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Find Chrome
        shell: bash
        run: |
          for browser in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$browser" >/dev/null 2>&1; then
              echo "PF_CHROMIUM_PATH=$(command -v "$browser")" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          exit 1
      - name: Start web app
        run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/pf-w218.log 2>&1 &
      - name: Check syntax
        run: |
          node --check app-w218.js
          node --check viewer-w218.js
          node --check page-adjustments-w218.js
          node --check page-repair-ui-w218.js
          node --check .github/scripts/w218-page-repair.mjs
      - name: PDF adjustment and annotations geometry
        run: node .github/scripts/w218-page-repair.mjs
